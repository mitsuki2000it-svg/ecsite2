<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<title>商品一覧</title>

	<link rel="stylesheet" href="style.css">

</head>

<body>

	<a id="admin-link" href="admin.html" hidden>
		管理画面へ
	</a>

	<form id="logout-form" action="/logout" method="post">

		<button type="submit">
			ログアウト
		</button>

	</form>

	<p>
		ログイン中:
		<span id="current-user"></span>
	</p>

	<div class="search-area">
		<h2>商品検索</h2>

		<input type="text" id="search-keyword" placeholder="商品を入力" onkeydown="handleSearchKey(event)">

		<button class="search-button" onclick="searchProducts()">
			検索
		</button>

		<button class="secondary-button" onclick="resetSearch()">
			リセット
		</button>

		<select id="sort-order" onchange="sortProducts()">
			<option value="">並べ替え</option>
			<option value="price-asc">価格が安い順</option>
			<option value="price-desc">価格が高い順</option>
		</select>

		<input type="number" id="min-price" placeholder="最低価格">

		<input type="number" id="max-price" placeholder="最高価格">

		<button class="search-button" onclick="applyFilters()">
			価格で絞り込み
		</button>

		<button class="secondary-button" onclick="resetFilters()">
			条件をリセット
		</button>

		<select id="page-size" onchange="changePageSize()">
			<option value="5">5件ずつ</option>
			<option value="10">10件ずつ</option>
			<option value="all">全件</option>
		</select>

		<label>
			<input type="checkbox" id="in-stock-only" onchange="applyFilters()">
			在庫ありのみ
		</label>

		<p id="product-count"></p>
	</div>

	<div class="shipping-area">
		<h2>配送先</h2>

		<input type="text" id="shipping-address" placeholder="配送先住所を入力" oninput="hideOrderConfirm()">

	</div>

	<h1>商品一覧</h1>

	<div class="products" id="products"></div>

	<div class="pagination-area">
		<button class="page-button" id="previous-button" onclick="previousPage()">前へ</button>

		<span id="page-info"></span>

		<button class="page-button" id="next-button" onclick="nextPage()">次へ</button>
	</div>

	<div class="cart-area">
		<h2>カート</h2>
		<div id="cart"></div>

		<div class="cart-actions"></div>

		<button id="cart-purchase-button" class="buy-button" onclick="showOrderConfirm()">
			注文内容を確認
		</button>

		<button id="cart-clear-button" class="danger-button" onclick="clearCart()">
			カートを空にする
		</button>
	</div>

	<div id="order-confirm-area" hidden>

		<h2>注文内容の確認</h2>

		<div id="order-confirm-items"></div>

		<p id="order-confirm-total"></p>

		<p id="order-confirm-address"></p>

		<button id="confirm-purchase-button" class="buy-button">
			この内容で購入する
		</button>

		<button class="secondary-button" onclick="hideOrderConfirm()">
			内容を修正する
		</button>

	</div>

	<h2>購入履歴</h2>

	<div id="my-sales"></div>

	<script src="script.js"></script>

</body>

</html>
