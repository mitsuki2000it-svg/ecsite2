<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>商品一覧</title>

	<link rel="stylesheet" href="style.css">
</head>

<body>

	<h2>商品検索</h2>

	<input type="text" id="search-keyword" placeholder="商品を入力" onkeydown="handleSearchKey(event)">

	<button onclick="searchProducts()">
		検索
	</button>

	<button onclick="resetSearch()">
		リセット
	</button>

	<select id="sort-order" onchange="sortProducts()">
		<option value="">並べ替え</option>
		<option value="price-asc">価格が安い順</option>
		<option value="price-desc">価格が高い順</option>
	</select>

	<input type="number" id="min-price" placeholder="最低価格">

	<input type="number" id="max-price" placeholder="最高価格">

	<button onclick="applyFilters()">
	価格で絞り込み
	</button>

	<button onclick="resetFilters()">
		条件をリセット
	</button>

	<select id="page-size" onchange="changePageSize()">
		<option value="5">5件ずつ</option>
		<option value="10">10件ずつ</option>
		<option value="all">全件</option>
	</select>

	<label>
		<input type="checkbox" id="in-stock-only" onchange="applyFilters()">
		在庫ありのみ
	</label>

	<p id="product-count"></p>

	<h1>商品一覧</h1>

	<div class="products" id="products"></div>

	<div id="pagination">
		<button id="previous-button" onclick="previousPage()">前へ</button>

		<span id="page-info"></span>

		<button id="next-button" onclick="nextPage()">次へ</button>
	</div>

	<h2>購入履歴</h2>

	<div id="sales"></div>

	<h2>総売上</h2>

	<p id="total-sales"></p>

	<h2>販売件数</h2>

	<p id="sale-count"></p>

	<h2>商品追加</h2>

	<input type="text" id="product-name" placeholder="商品名">
	<input type="number" id="product-price" placeholder="価格">
	<input type="number" id="product-stock" placeholder="在庫">

	<button onclick="createProduct()">商品を追加</button>

	<h2>商品編集</h2>

	<input type="hidden" id="edit-product-id">

	<input type="text" id="edit-product-name" placeholder="商品名">

	<input type="number" id="edit-product-price" placeholder="価格">

	<input type="number" id="edit-product-stock" placeholder="在庫">

	<button onclick="updateProduct()">
		更新
	</button>

	<script src="script.js"></script>

</body>

</html>
