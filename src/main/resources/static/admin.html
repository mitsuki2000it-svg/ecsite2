<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<title>管理画面</title>

	<link rel="stylesheet" href="style.css">

</head>

<body>

	<hader clss="site-header">

		<div class="header-inner">

			<a class="site-title" href="/">
				EC SITE
			</a>

			<div class="header-user-area">

				<a href="/">
					商品一覧へ
				</a>

				<span class="login-user">
					管理画面
				</span>

				<form id="logout-form" action="/logout" method="post">
					<button type="submit" class="logout-button">
						ログアウト
					</button>
				</form>

			</div>

		</div>

	</header>

	<h1>管理画面</h1>

	<h2>商品管理</h2>
	<div class="products" id="admin-products"></div>

	<div class="sales-area">
		<h2>購入履歴</h2>

		<div id="sales"></div>
	</div>

	<div class="stats-area">

		<div class="stats-item">
			<h2>総売上</h2>
			<p id="total-sales"></p>
		</div>

		<div class="stats-item">
			<h2>販売件数</h2>
			<p id="sale-count"></p>
		</div>

	</div>

	<div class="form-area">
		<h2>商品追加</h2>

		<div class="form-group">
			<label for="product-name">
				商品名
			</label>
			<input type="text" id="product-name" placeholder="商品名">

		</div>

		<div class="form-group">
			<label for="product-price">
				価格
			</label>
			<input type="number" id="product-price" placeholder="価格">

		</div>

		<div class="form-group">
			<label for="product-stock">
				在庫
			</label>
			<input type="number" id="product-stock" placeholder="在庫">

		</div>

		<button class="add-button" onclick="createProduct()">商品を追加</button>
	</div>

	<div class="edit-area">
		<h2>商品編集</h2>

		<input type="hidden" id="edit-product-id">

		<div class="form-group">
			<label for="edit-product-name">商品名</label>

			<input type="text" id="edit-product-name" placeholder="商品名">
		</div>

		<div class="form-group">
			<label for="edit-product-price">価格</label>
			<input type="number" id="edit-product-price" placeholder="価格">
		</div>

		<div class="form-group">
			<label for="edit-product-stock">在庫</label>
			<input type="number" id="edit-product-stock" placeholder="在庫">
		</div>

		<button class="edit-button" onclick="updateProduct()">
			更新
		</button>
	</div>
	<script src="admin.js"></script>
</body>

</html>
